---
services:
  vaultwarden:
    image: ghcr.io/dani-garcia/vaultwarden:latest
    container_name: vaultwarden
    hostname: vaultwarden
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /opt/stacks/vaultwarden/config:/data:rw
    ports:
      - 8004:80/tcp
    healthcheck:
      disable: true
    user: 1000:1000
    networks:
      - proxy

networks:
  proxy:
    external: true
