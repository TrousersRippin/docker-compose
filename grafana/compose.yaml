---
services:
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_GENERIC_OAUTH_AUTH_STYLE: InHeader
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ICON: signin
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_NAME: OIDC
      GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH: name
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email groups
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: "true"
      GF_DATABASE_HOST: "postgres:5432"
      GF_DATABASE_NAME: grafana
      GF_DATABASE_SSL_MODE: disable
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_USER: grafana
      GF_LOG_FILTERS: "search-manifest-watcher:error"
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource
    env_file: secret.env  # GF_AUTH_GENERIC_OAUTH_API_URL, GF_AUTH_GENERIC_OAUTH_AUTH_URL, GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET, GF_AUTH_GENERIC_OAUTH_TOKEN_URL, GF_DATABASE_PASSWORD, GF_SERVER_ROOT_URL
    volumes:
      - /opt/stacks/grafana/config:/etc/grafana:ro
      - grafana-data:/var/lib/grafana:rw
    ports:
      - 3000:3000/tcp
    networks:
      - proxy

volumes:
  grafana-data:
    name: grafana-data
    external: true

networks:
  proxy:
    external: true
