---
services:
  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /opt/stacks/grafana/config:/etc/grafana:ro
      - grafana-data:/var/lib/grafana:rw
    ports:
      - 3000:3000/tcp
    networks:
      - proxy

volumes:
  grafana-data:
    name: grafana-data
    external: true

networks:
  proxy:
    external: true
