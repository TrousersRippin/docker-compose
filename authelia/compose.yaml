---
services:
  authelia:
    image: ghcr.io/authelia/authelia:latest
    container_name: authelia
    hostname: authelia
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - authelia
      - --config=/config/configuration.yml
      - --config=/config/configuration.acl.yml
      - --config=/config/configuration.oidc.yml
    env_file: .env
    volumes:
      - /opt/stacks/authelia/config:/config:rw
      - /opt/stacks/authelia/secrets:/run/secrets:ro
    ports:
      - 9094:9094/tcp
      - 9959:9959/tcp
    healthcheck:
      disable: true
    user: ${UID:-1000}:${GID:-1000}      
    networks:
      - proxy

networks:
  proxy:
    external: true
