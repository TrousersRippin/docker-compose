---
services:
  dozzle:
    image: ghcr.io/amir20/dozzle:latest
    container_name: dozzle
    hostname: dozzle
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      DOZZLE_AUTH_OIDC_CLIENT_ID: dozzle
      DOZZLE_AUTH_OIDC_NAME: OIDC
      DOZZLE_AUTH_OIDC_SCOPES: dozzle_roles
      DOZZLE_AUTH_PROVIDER: oidc
      DOZZLE_ENABLE_ACTIONS: "true"
      DOZZLE_HOSTNAME: homelab
      DOZZLE_NO_ANALYTICS: "true"
    env_file: secret.env  # DOZZLE_AUTH_OIDC_CLIENT_SECRET, DOZZLE_AUTH_OIDC_ISSUER
    volumes:
      - /opt/stacks/dozzle/data:/data:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080/tcp
    user: 1000:1000
    group_add: [986]
    networks:
      - proxy

networks:
  proxy:
    external: true
