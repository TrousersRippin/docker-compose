---
services:
  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    container_name: pgadmin
    hostname: pgadmin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      PGADMIN_LISTEN_PORT: 8002
    env_file: secret.env  # PGADMIN_DEFAULT_EMAIL, PGADMIN_DEFAULT_PASSWORD
    volumes:
      - /opt/stacks/pgadmin/data:/var/lib/pgadmin:rw
    ports:
      - 8002:8002/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
