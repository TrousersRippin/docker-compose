---
services:
  netbootxyz:
    image: ghcr.io/netbootxyz/netbootxyz
    container_name: netbootxyz
    hostname: netbootxyz
    restart: unless-stopped
    environment:
      - TFTPD_OPTS=--tftp-single-port
      - NGINX_PORT=80
      - WEB_APP_PORT=3333
    volumes:
      - /opt/stacks/netbootxyz/config:/config:rw
      - /opt/stacks/netbootxyz/assets:/assets:rw
    ports:
      - 3333:3333/tcp
      - 69:69/udp
      - 8084:80/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
