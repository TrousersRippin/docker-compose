---
services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    hostname: bazarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
      - PUID=1000
      - PGID=1000
    volumes:
      - /opt/stacks/bazarr/config:/config:rw
      - /mnt/ssd:/data:rw
    ports:
      - 6767:6767/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
