---
services:
  memos:
    image: ghcr.io/usememos/memos:stable
    container_name: memos
    hostname: memos
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      MEMOS_DRIVER: postgres
    env_file: secret.env  # MEMOS_DSN
    volumes:
      - /opt/stacks/memos/config:/var/opt/memos:rw
    ports:
      - 5230:5230/tcp
    user: 1000:1000
    networks:
      - proxy

networks:
  proxy:
    external: true
