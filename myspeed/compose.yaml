---
services:
  myspeed:
    image: docker.io/germannewsmaker/myspeed:latest
    container_name: myspeed
    hostname: myspeed
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/myspeed/data:/myspeed/data:rw
    ports:
      - 5216:5216/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
