---
services:
  filebrowser:
    image: docker.io/filebrowser/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /opt/stacks/filebrowser/config:/config:rw
      - /opt/stacks/filebrowser/database:/database:rw
      - /:/srv:rw
    ports:
      - 8005:8005/tcp
    healthcheck:
      disable: true
    networks:
      - proxy

networks:
  proxy:
    external: true
