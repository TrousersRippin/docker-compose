---
services:
  filebrowser:
    image: ghcr.io/gtsteffaniak/filebrowser:latest
    container_name: filebrowser
    hostname: filebrowser
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      FILEBROWSER_CONFIG: /home/filebrowser/config/config.yaml
      FILEBROWSER_OIDC_CLIENT_ID: filebrowser
    env_file: secret.env  # FILEBROWSER_ADMIN_PASSWORD, FILEBROWSER_OIDC_CLIENT_SECRET
    volumes:
      - /opt/stacks/filebrowser/config:/home/filebrowser/config:rw
      - /opt/stacks/filebrowser/data:/home/filebrowser/data:rw
      - /home/troy:/mnt/home-troy:rw
      - /mnt:/mnt/host-mnt:rw
      - /opt/stacks:/mnt/host-opt:rw
    ports:
      - 8005:8005/tcp
    healthcheck:
      disable: true
    user: 1000:1000
    networks:
      - proxy

networks:
  proxy:
    external: true
