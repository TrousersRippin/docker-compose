---
services:
  nginx:
    image: docker.io/nginx:alpine
    container_name: nginx
    hostname: nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/nginx/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - /opt/stacks/nginx/config/html:/usr/share/nginx/html:ro
      - /opt/stacks/nginx/config/certs:/etc/nginx/certs:ro
    ports:
      - 8800:80/tcp
      - 8443:443/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
