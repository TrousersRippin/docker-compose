---
services:
  nginx:
    image: docker.io/nginx:alpine
    container_name: nginx
    hostname: nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/nginx/config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /opt/stacks/nginx/agama:/usr/share/nginx/html/agama:ro
      - /opt/stacks/nginx/autoinstall:/usr/share/nginx/html/autoinstall:ro
      - /opt/stacks/nginx/kickstart:/usr/share/nginx/html/kickstart:ro
      - /opt/stacks/nginx/preseed:/usr/share/nginx/html/preseed:ro
    ports:
      - 8082:80/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
