---
services:
  technitium:
    image: docker.io/technitium/dns-server:latest
    container_name: technitium
    hostname: technitium
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
    env_file: .env
    volumes:
      - /opt/stacks/technitium/config:/etc/dns:rw
    ports:
      - 5380:5380/tcp
      - 53:53/tcp
      - 53:53/udp
      - 53443:53443/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
