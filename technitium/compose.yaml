---
services:
  technitium:
    image: docker.io/technitium/dns-server:latest
    container_name: technitium
    hostname: technitium
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    sysctls:
      - net.ipv4.ip_local_port_range=1024 65000
    environment:
      - TZ=${TZ}
      - DNS_SERVER_ADMIN_PASSWORD=${DNS_SERVER_ADMIN_PASSWORD}
      - DNS_SERVER_DOMAIN=${DNS_SERVER_DOMAIN}
      - DNS_SERVER_FORWARDERS=${DNS_SERVER_FORWARDERS}
      - DNS_SERVER_PREFER_IPV6=${DNS_SERVER_PREFER_IPV6}
      - DNS_SERVER_RECURSION=${DNS_SERVER_RECURSION}
      - DOTNET_GCConserveMemory=9
      - DOTNET_gcServer=0
    volumes:
      - /opt/stacks/technitium/config:/etc/dns:rw
    ports:
      - 5380:5380/tcp
      - 53:53/tcp
      - 53:53/udp
      - 53443:53443/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
