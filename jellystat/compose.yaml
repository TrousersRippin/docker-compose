---
services:
  jellystat:
    image: ghcr.io/cyfershepard/jellystat:latest
    container_name: jellystat
    hostname: jellystat
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-file: 5
        max-size: 10m
    environment:
      TZ: Europe/Stockholm
      POSTGRES_DB: jellystat
      POSTGRES_IP: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: jellystat
    env_file: secret.env  # JWT_SECRET, POSTGRES_PASSWORD
    volumes:
      - /opt/stacks/jellystat/data:/app/backend/backup-data:rw
    ports:
      - 3004:3000/tcp
    healthcheck:
      disable: true
    networks:
      - proxy

networks:
  proxy:
    external: true
