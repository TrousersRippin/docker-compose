---
services:
  postgres:
    image: docker.io/library/postgres:18.4
    container_name: postgres
    hostname: postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: postgres --hba-file=/etc/postgresql/pg_hba.conf
    env_file: .env
    volumes:
      - /opt/stacks/postgres/config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - postgres-data:/var/lib/postgresql:rw
    ports:
      - 5432:5432/tcp
    networks:
      - proxy

volumes:
  postgres-data:
    name: postgres-data
    external: true

networks:
  proxy:
    external: true
