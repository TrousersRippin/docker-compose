---
services:
  unpoller:
    image: ghcr.io/unpoller/unpoller:latest
    container_name: unpoller
    hostname: unpoller
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - 9130:9130/tcp
    healthcheck:
      disable: true
    networks:
      - proxy

networks:
  proxy:
    external: true
