---
services:
  transmission:
    image: ghcr.io/linuxserver/transmission:latest
    container_name: transmission
    hostname: transmission
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /opt/stacks/transmission/config:/config:rw
      - /opt/stacks/transmission/watch:/watch:rw
      - /mnt/nvme/torrents:/data/torrents:rw
    ports:
      - 9092:9091/tcp
      - 51413:51413/tcp
      - 51413:51413/udp
    networks:
      - proxy

networks:
  proxy:
    external: true
