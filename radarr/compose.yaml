---
services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
      - PUID=1000
      - PGID=1000
      - DOTNET_GCConserveMemory=9
      - DOTNET_gcServer=0
    volumes:
      - /opt/stacks/radarr/config:/config:rw
      - /mnt/ssd:/data:rw
    ports:
      - 7878:7878/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
