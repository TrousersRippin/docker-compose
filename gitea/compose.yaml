---
services:
  gitea:
    image: ghcr.io/go-gitea/gitea:latest-rootless
    container_name: gitea
    hostname: gitea
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: "postgres:5432"
      GITEA__database__NAME: gitea
      GITEA__database__SSL_MODE: disable
      GITEA__database__USER: gitea
    env_file: secret.env  # GITEA__database__PASSWD
    volumes:
      - /opt/stacks/gitea/config:/etc/gitea:rw
      - /opt/stacks/gitea/data:/var/lib/gitea:rw
    ports:
      - 3002:3000/tcp
      - 2222:2222/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
