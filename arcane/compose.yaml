---
services:
  arcane:
    image: ghcr.io/getarcaneapp/manager:latest
    container_name: arcane
    hostname: arcane
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      ARCANE_ANALYTICS_DISABLED: "true"
      ARCANE_OIDC_CLIENT_ID: arcane
      ARCANE_OIDC_ENABLED: "true"
      ARCANE_OIDC_MERGE_ACCOUNTS: "true"
      ARCANE_OIDC_SCOPES: email openid profile
      ARCANE_PROJECTS_DIRECTORY: /opt/stacks/compose
      ARCANE_TRUSTED_PROXIES: 10.100.0.0/24
      PGID: 1000
      PUID: 1000
    env_file: secret.env  # ARCANE_APP_URL, ARCANE_ENCRYPTION_KEY, ARCANE_OIDC_CLIENT_SECRET, ARCANE_OIDC_ISSUER_URL
    volumes:
      - /opt/stacks/arcane/data:/app/data:rw
      - /opt/stacks:/opt/stacks:rw
      - /mnt/nvme/backup:/backups:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 3552:3552/tcp
    healthcheck:
      disable: true
    group_add: [986]
    networks:
      - proxy

networks:
  proxy:
    external: true
