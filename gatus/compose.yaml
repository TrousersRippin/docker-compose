---
services:
  gatus:
    image: ghcr.io/twin/gatus:latest
    container_name: gatus
    hostname: gatus
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      GATUS_CONFIG_PATH: /config
      GATUS_OIDC_CLIENT_ID: gatus
      GATUS_OIDC_SESSION_TTL: 24h
    env_file: secret.env  # GATUS_OIDC_CLIENT_SECRET, GATUS_OIDC_ISSUER_URL, GATUS_OIDC_REDIRECT_URL
    volumes:
      - /opt/stacks/gatus/config:/config:ro
      - /opt/stacks/gatus/data:/data:rw
    ports:
      - 8081:8080/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
