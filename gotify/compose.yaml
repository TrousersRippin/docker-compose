---
services:
  gotify:
    image: ghcr.io/gotify/server:latest
    container_name: gotify
    hostname: gotify
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      GOTIFY_DATABASE_CONNECTION: data/gotify.db
      GOTIFY_DATABASE_DIALECT: sqlite3
      GOTIFY_DEFAULTUSER_NAME: troy
      GOTIFY_OIDC_CLIENTID: gotify
      GOTIFY_OIDC_ENABLED: "true"
      GOTIFY_OIDC_GROUPS_ADMIN: admins
      GOTIFY_OIDC_GROUPS_CLAIM: groups
      GOTIFY_OIDC_GROUPS_USER: dev
      GOTIFY_OIDC_IDP_NAME: Authelia
      GOTIFY_OIDC_LINK_BY_USERNAME: "true"
      GOTIFY_OIDC_PROMPT: ""
      GOTIFY_OIDC_SCOPES: openid,profile,email,groups
      GOTIFY_OIDC_USERNAMECLAIM: preferred_username
    env_file: secret.env  # GOTIFY_DEFAULTUSER_PASS, GOTIFY_OIDC_CLIENTSECRET, GOTIFY_OIDC_ISSUER, GOTIFY_OIDC_REDIRECTURL
    volumes:
      - /opt/stacks/gotify/config:/app/data:rw
    ports:
      - 8001:80/tcp
    healthcheck:
      disable: true
    user: 1000:1000
    networks:
      - proxy

networks:
  proxy:
    external: true
