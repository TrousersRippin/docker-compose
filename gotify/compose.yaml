---
services:
  gotify:
    image: ghcr.io/gotify/server:latest
    container_name: gotify
    hostname: gotify
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TZ}
      - GOTIFY_DATABASE_CONNECTION=${GOTIFY_DATABASE_CONNECTION}
      - GOTIFY_DATABASE_DIALECT=${GOTIFY_DATABASE_DIALECT}
      - GOTIFY_DEFAULTUSER_NAME=${GOTIFY_DEFAULTUSER_NAME}
      - GOTIFY_DEFAULTUSER_PASS=${GOTIFY_DEFAULTUSER_PASS}
      - GOTIFY_OIDC_ISSUER=${GOTIFY_OIDC_ISSUER}
      - GOTIFY_OIDC_CLIENTID=${GOTIFY_OIDC_CLIENTID}
      - GOTIFY_OIDC_CLIENTSECRET=${GOTIFY_OIDC_CLIENTSECRET}
      - GOTIFY_OIDC_ENABLED=${GOTIFY_OIDC_ENABLED}
      - GOTIFY_OIDC_REDIRECTURL=${GOTIFY_OIDC_REDIRECTURL}
      - GOTIFY_OIDC_AUTOREGISTER=${GOTIFY_OIDC_AUTOREGISTER}
      - GOTIFY_OIDC_USERNAMECLAIM=${GOTIFY_OIDC_USERNAMECLAIM}
      - GOTIFY_SERVER_PORT=${GOTIFY_SERVER_PORT}
    volumes:
      - /opt/stacks/gotify/config:/app/data:rw
    ports:
      - 8001:8001/tcp
    healthcheck:
      disable: true
    user: ${UID:-1000}:${GID:-1000}
    networks:
      - proxy

networks:
  proxy:
    external: true
