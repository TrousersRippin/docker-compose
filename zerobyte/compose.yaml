---
services:
  zerobyte:
    image: ghcr.io/nicotsx/zerobyte:latest
    container_name: zerobyte
    hostname: zerobyte
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      RCLONE_CONFIG_DIR: /home/troy/.config/rclone
    env_file: secret.env  # APP_SECRET, BASE_URL, TRUSTED_ORIGINS, WEBHOOK_ALLOWED_ORIGINS
    volumes:
      - /opt/stacks/zerobyte:/var/lib/zerobyte:rw
      - /home/troy/.config/rclone:/home/troy/.config/rclone:ro
      - /opt/stacks:/data:rw
    ports:
      - 4096:4096/tcp
    user: 1000:1000
    networks:
      - proxy

networks:
  proxy:
    external: true
