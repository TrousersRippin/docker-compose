---
services:
  alloy:
    image: docker.io/grafana/alloy:latest
    container_name: alloy
    hostname: homelab
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    volumes:
      - /opt/stacks/alloy/config/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data:rw
      - /:/rootfs:ro
      - /run:/run:ro
      - /run/udev/data:/run/udev/data:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 12345:12345/tcp
      - 5514:5514/udp
    user: 0:0
    networks:
      - proxy

  loki:
    image: docker.io/grafana/loki:latest
    container_name: loki
    hostname: loki
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    command:
      - --config.file=/etc/loki/loki.yaml
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/loki/config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki:rw
    ports:
      - 3100:3100/tcp
    depends_on:
      - alloy
    networks:
      - proxy

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    volumes:
      - /opt/stacks/grafana/config:/etc/grafana:ro
      - grafana-data:/var/lib/grafana:rw
    ports:
      - 3333:3333/tcp
    depends_on:
      - loki
    networks:
      - proxy

volumes:
  alloy-data:
    name: alloy-data
    external: true
  loki-data:
    name: loki-data
    external: true
  grafana-data:
    name: grafana-data
    external: true

networks:
  proxy:
    external: true
