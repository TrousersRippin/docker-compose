---
services:
  alloy:
    image: docker.io/grafana/alloy:latest
    container_name: alloy
    hostname: homelab
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
      - ALLOY_HOSTNAME=beelink.thenoisykeyboard.com
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=experimental
      - /etc/alloy/config.alloy    
    volumes:
      - /opt/stacks/alloy/config/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data:rw
      - /:/rootfs:ro
      - /run:/run:ro
      - /run/udev/data:/run/udev/data:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/log:/var/log:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 12345:12345/tcp
      - 5514:5514/udp
    user: 0:0
    networks:
      - proxy

  loki:
    image: docker.io/grafana/loki:latest
    container_name: loki
    hostname: loki
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt:
      - no-new-privileges:true
    command:
      - --config.file=/etc/loki/loki.yaml
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/loki/config/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki:rw
    ports:
      - 3100:3100/tcp
    depends_on:
      - alloy
    networks:
      - proxy

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
      - GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN=${GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN}
      - GF_AUTH_GENERIC_OAUTH_API_URL=${GF_AUTH_GENERIC_OAUTH_API_URL}
      - GF_AUTH_GENERIC_OAUTH_AUTH_STYLE=${GF_AUTH_GENERIC_OAUTH_AUTH_STYLE}
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=${GF_AUTH_GENERIC_OAUTH_AUTH_URL}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GF_AUTH_GENERIC_OAUTH_CLIENT_ID}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      - GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES=${GF_AUTH_GENERIC_OAUTH_EMPTY_SCOPES}
      - GF_AUTH_GENERIC_OAUTH_ENABLED=${GF_AUTH_GENERIC_OAUTH_ENABLED}
      - GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH}
      - GF_AUTH_GENERIC_OAUTH_ICON=${GF_AUTH_GENERIC_OAUTH_ICON}
      - GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH}
      - GF_AUTH_GENERIC_OAUTH_NAME=${GF_AUTH_GENERIC_OAUTH_NAME}
      - GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_NAME_ATTRIBUTE_PATH}
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=${GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH}
      - GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT=${GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=${GF_AUTH_GENERIC_OAUTH_SCOPES}
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=${GF_AUTH_GENERIC_OAUTH_TOKEN_URL}
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=${GF_AUTH_GENERIC_OAUTH_USE_PKCE}
    volumes:
      - /opt/stacks/grafana/config:/etc/grafana:ro
      - grafana-data:/var/lib/grafana:rw
    ports:
      - 3333:3333/tcp
    depends_on:
      - loki
    networks:
      - proxy

volumes:
  alloy-data:
    name: alloy-data
    external: true
  loki-data:
    name: loki-data
    external: true
  grafana-data:
    name: grafana-data
    external: true

networks:
  proxy:
    external: true
