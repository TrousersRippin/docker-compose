---
services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    hostname: sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
      - PUID=1000
      - PGID=1000
      - DOTNET_GCConserveMemory=9
      - DOTNET_gcServer=0
    volumes:
      - /opt/stacks/sonarr/config:/config:rw
      - /mnt/ssd:/data:rw
    ports:
      - 8989:8989/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
