---
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: umami
    hostname: umami
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    env_file: .env
    ports:
      - 3006:3000/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
