---
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    container_name: umami
    hostname: umami
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
      DATABASE_TYPE: postgresql
    env_file: secret.env  # APP_SECRET, DATABASE_URL, TWO_FACTOR_ENCRYPTION_KEY
    ports:
      - 3006:3000/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
