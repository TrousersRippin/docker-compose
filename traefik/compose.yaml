---
services:
  traefik:
    image: ghcr.io/traefik/traefik:latest
    container_name: traefik
    hostname: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Stockholm
    env_file: secret.env  # CF_API_EMAIL, CF_DNS_API_TOKEN
    volumes:
      - /opt/stacks/traefik/config:/etc/traefik:ro
      - /opt/stacks/traefik/data:/data:rw
      - /opt/stacks/traefik/log:/var/log/traefik:rw
    ports:
      - 80:80/tcp
      - 443:443/tcp
    networks:
      - proxy

networks:
  proxy:
    external: true
