---
services:
  kavita:
    image: ghcr.io/kareadita/kavita:latest
    container_name: kavita
    hostname: kavita
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Stockholm
    volumes:
      - /opt/stacks/kavita/config:/kavita/config:rw
      - /mnt/ssd/media/books:/books:ro
    ports:
      - 5000:5000/tcp
    user: ${UID:-1000}:${GID:-1000}
    networks:
      - proxy

networks:
  proxy:
    external: true
